# ==============================================================================
# iNES UNROM (128 KB) Configuration for ca65 / ld65
# ==============================================================================

MEMORY {
    # --------------------------------------------------------------------------
    # NES Internal RAM Layout
    # --------------------------------------------------------------------------
    # Zero Page RAM ($0000 - $00FF) used for fast-access variables
    ZP:         start = $0000, size = $0100, type = rw, define = yes;
    
    # OAM Sprite Buffer RAM area ($0200 - $02FF) strictly reserved for PPU DMA updates
    OAM_MEM:    start = $0200, size = $0100, type = rw;
    
    # General-purpose internal Work RAM ($0300 - $07FF)
    RAM:        start = $0300, size = $0500, type = rw, define = yes;

    # --------------------------------------------------------------------------
    # Cartridge Expansion Memory
    # --------------------------------------------------------------------------
    # Non-volatile Save RAM / Work RAM area (8 KB located at $6000 - $7FFF)
    SRAM_MEM:   start = $6000, size = $2000, type = rw, define = yes;

    # --------------------------------------------------------------------------
    # Physical Rom Output Format
    # --------------------------------------------------------------------------
    # iNES Header (16 bytes) at the very front of the compiled file
    HEADER:     start = $0000, size = $0010, type = ro, file = %O, fill = yes;

    # Switchable PRG-ROM banks ($8000 - $BFFF), 16 KB each. 
    # Unused space inside banks is padded with $FF to preserve hardware dimensions.
    PRG_BANK0:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 0;
    PRG_BANK1:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 1;
    PRG_BANK2:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 2;
    PRG_BANK3:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 3;
    PRG_BANK4:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 4;
    PRG_BANK5:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 5;
    PRG_BANK6:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 6;

    # Monolithic Fixed PRG-ROM bank ($C000 - $FFFF) — Bank 7 (The last 16 KB)
    PRG_FIXED:  start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = 7;
}

SEGMENTS {
    # --------------------------------------------------------------------------
    # Hardware Header & RAM Segments
    # --------------------------------------------------------------------------
    INESHDR:    load = HEADER,    type = ro;
    ZEROPAGE:   load = ZP,        type = zp;
    OAM:        load = OAM_MEM,   type = bss, align = 256;
    BSS:        load = RAM,       type = bss, define = yes;
    SRAM:       load = SRAM_MEM,  type = bss, define = yes;

    # --------------------------------------------------------------------------
    # Switchable PRG Banks Setup
    # --------------------------------------------------------------------------
    BANK0:      load = PRG_BANK0, type = ro, align = 256;
    BANK1:      load = PRG_BANK1, type = ro, align = 256;
    BANK2:      load = PRG_BANK2, type = ro, align = 256;
    BANK3:      load = PRG_BANK3, type = ro, align = 256;
    BANK4:      load = PRG_BANK4, type = ro, align = 256;
    BANK5:      load = PRG_BANK5, type = ro, align = 256;
    BANK6:      load = PRG_BANK6, type = ro, align = 256;

    # --------------------------------------------------------------------------
    # Dual-Addressing Segments (Packed Back-to-Back in ROM, Split in RAM)
    # --------------------------------------------------------------------------
    # Main bootloader functions: Packed in fixed ROM, executes from RAM at $0500
    RAM_ROUTINES: load = PRG_FIXED, run = RAM, type = ro, define = yes, start = $0500;
    
    # Self-wiping cleanup utility: Packed in fixed ROM right after routines, executes from RAM at $07E0
    LOADER_CLEAN: load = PRG_FIXED, run = RAM, type = ro, define = yes, start = $07E0;

    # --------------------------------------------------------------------------
    # Standard Fixed ROM Bank Data & Hardware Vectors
    # --------------------------------------------------------------------------
    # Permanent engine code and read-only tables in Bank 7
    CODE:       load = PRG_FIXED, type = ro;
    RODATA:     load = PRG_FIXED, type = ro;
    
    # UNROM Bus Conflict prevention table (16 bytes aligned to address $FFE0)
    BANK_TABLE: load = PRG_FIXED, type = ro, start = $FFE0;
    
    # Hardware Interrupt Vector Table (NMI, RESET, IRQ) strictly located at $FFFA - $FFFF
    VECTORS:    load = PRG_FIXED, type = ro, start = $FFFA;
}