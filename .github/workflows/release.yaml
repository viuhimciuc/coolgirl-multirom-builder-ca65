# Automation name displayed in the Actions tab on GitHub
name: Release

# Trigger configuration.
# workflow_dispatch means the process is launched manually via a button in the GitHub web interface
on:
  workflow_dispatch:

jobs:
    # =========================================================================
  # BLOCK 1: Create or update a draft release on GitHub (Option B)
  # =========================================================================
  create-release: 
    runs-on: ubuntu-latest # Run on the latest version of Ubuntu Linux
    steps:
    - name: Create or Update Release
      id: create_release # Unique step ID so other tasks below can access the release link
      uses: ncipollo/release-action@v1 # Use the official plugin for working with releases
      with:
        token: ${{ secrets.GITHUB_TOKEN }} # Automatic GitHub secret key for write access to the repository
        tag: ${{ github.event.repository.updated_at }} # Release version tag (uses the date/time of the last code update)
        commit: ${{ github.head_ref || github.ref_name }} # Specifies the Git branch to which this release will be linked
        name: Release ${{ github.event.repository.updated_at }} # Text name of the release visible to users on GitHub
        draft: true # Create the release as a “Draft” (hidden from regular users until published)
        
        # --- AUTO-UPDATE SETTINGS (OPTION B) ---
        allowUpdates: true # ALLOW UPDATES: If a release with this tag already exists, the script will open it for editing instead of failing
        removeArtifacts: true # REMOVE OLD FILES: Before uploading new builds, the plugin will delete old archives from this draft

    # Step 1.2: Save the unique upload URL into a text file
    - name: Output Release URL File
      run: echo "${{ steps.create_release.outputs.upload_url }}" > release_url.txt

    # Step 1.3: Upload this file to GitHub Artifacts.
    # This is required so other independent jobs below can read this URL.
    - name: Save Release URL File for publish
      uses: actions/upload-artifact@v4
      with:
        name: release_url
        path: release_url.txt

  # =========================================================================
  # BLOCK 2: Build the project for Linux (x64, ARM32, ARM64)
  # =========================================================================
  build-linux:
    needs: create-release # This block will not start until Block 1 completes successfully
    strategy:
      matrix:
        # Build matrix: the project will be built twice.
        # 1. no-self-contained (depends on .NET installed on the user's system)
        # 2. self-contained (all .NET libraries embedded directly into the executable)
        sc: [no-self-contained, self-contained]
    runs-on: ubuntu-latest
    env:
      # Global environment variables for this block
      APP_NAME: coolgirl-multirom-builder-ca65
      OUTPUT_DIR: coolgirl-multirom-builder-ca65
      COMBINER_DIR: coolgirl-multirom-builder-ca65/tools/CoolgirlCombiner-ca65 # Folder for Combiner
      NESTILER_DIR: coolgirl-multirom-builder-ca65/tools/nestiler # Folder for NesTiler
      # Final archive names depending on the matrix mode
      OUTPUT_FILE_X64: coolgirl-multirom-builder-ca65-linux-x64${{ matrix.sc == 'self-contained' && '-self-contained' || '' }}.tar.gz
      OUTPUT_FILE_ARM32: coolgirl-multirom-builder-ca65-linux-arm32${{ matrix.sc == 'self-contained' && '-self-contained' || '' }}.tar.gz
      OUTPUT_FILE_ARM64: coolgirl-multirom-builder-ca65-linux-arm64${{ matrix.sc == 'self-contained' && '-self-contained' || '' }}.tar.gz
    steps:
    # Step 2.1: Download repository source code
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: true # Also download submodules if present

    # Step 2.2: Install .NET SDK version 6.0
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 6.0.x

    # Step 2.3: Update Ubuntu package manager
    - name: apt-get update
      run: sudo apt-get update

    # Step 2.4: Install GCC cross-compilers for ARM (32/64-bit) and cc65 (ca65) compiler for 8-bit CPUs
    - name: Get ARM toolchain
      run: sudo apt-get install gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu

    - name: Install cc65 compiler (ca65)
      run: sudo apt-get install -y cc65

    # Step 2.5: Create release folder and copy main scripts, assemblers, and documentation
    - name: Copy main files
      run: >-
           mkdir -p ${{ env.OUTPUT_DIR }} &&
           cp -fR Makefile README.md configs demos games images spec src ${{ env.OUTPUT_DIR }}

    # Step 2.6: Download the text file with the release URL created in Block 1
    - name: Load Release URL File from release job
      uses: actions/download-artifact@v4.1.7
      with:
        name: release_url

    # Step 2.7: Extract the URL and export it as a variable for this step
    - name: Get Release File Name & Upload URL
      id: get_release_info
      run: |
        value=`cat release_url.txt`
        echo upload_url=$value >> $GITHUB_OUTPUT

    # --- Linux subsection: Build utilities for x64 architecture ---
    - name: Build CoolgirlCombiner-ca65 for Linux-x64
      env:
        # If matrix = self-contained, add flags to embed libraries and disable trimming
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/CoolgirlCombiner-ca65 -c Release -r linux-x64 -o ${{ env.COMBINER_DIR }} ${{ env.SC_OPS }}

    - name: Build NesTiler for Linux-x64
      env:
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/NesTiler/NesTiler -c Release -r linux-x64 -o ${{ env.NESTILER_DIR }} ${{ env.SC_OPS }}

    - name: Remove unnecessary files
      run: rm -f ${{ env.COMBINER_DIR }}/*.md ${{ env.NESTILER_DIR }}/*.md # Remove extra .md files from tool folders

    - name: Test build
      run: make -C ${{ env.OUTPUT_DIR }} all # Run test build via project Makefile

    - name: Clean build files
      run: make -C ${{ env.OUTPUT_DIR }} clean # Clean test results before archiving

    - name: Archive Linux-x64
      env:
        CMD: tar -czvf # Command to create tar.gz archive
      run: |
        ${{ env.CMD }} ${{ env.OUTPUT_FILE_X64 }} ${{ env.OUTPUT_DIR }}

    - name: Upload Linux-x64
      uses: actions/upload-release-asset@v1 # Upload ready Linux-x64 archive to GitHub release page
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.get_release_info.outputs.upload_url }}
        asset_path: ${{ env.OUTPUT_FILE_X64 }}
        asset_name: ${{ env.OUTPUT_FILE_X64 }}
        asset_content_type: tar.gz

    - name: Clean directories
      run: rm -rf ${{ env.COMBINER_DIR }}/* ${{ env.NESTILER_DIR }}/* # Clean tool folders before next architecture build

    # --- Linux subsection: Build utilities for ARM32 architecture ---
    - name: Build CoolgirlCombiner-ca65 for Linux-ARM32
      env:
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/CoolgirlCombiner-ca65 -c Release -r linux-arm -o ${{ env.COMBINER_DIR }} ${{ env.SC_OPS }}

    - name: Build NesTiler for Linux-ARM32
      env:
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/NesTiler/NesTiler -c Release -r linux-arm -o ${{ env.NESTILER_DIR }} ${{ env.SC_OPS }}

    - name: Remove unnecessary files
      run: rm -f ${{ env.COMBINER_DIR }}/*.md ${{ env.NESTILER_DIR }}/*.md

    - name: Archive Linux-ARM32
      env:
        CMD: tar -czvf
      run: |
        ${{ env.CMD }} ${{ env.OUTPUT_FILE_ARM32 }} ${{ env.OUTPUT_DIR }}

    - name: Upload Linux-ARM32
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.get_release_info.outputs.upload_url }}
        asset_path: ${{ env.OUTPUT_FILE_ARM32 }}
        asset_name: ${{ env.OUTPUT_FILE_ARM32 }}
        asset_content_type: tar.gz

    - name: Clean directories
      run: rm -rf ${{ env.COMBINER_DIR }}/* ${{ env.NESTILER_DIR }}/*

    # --- Linux subsection: Build utilities for ARM64 architecture ---
    - name: Build CoolgirlCombiner-ca65 for Linux-ARM64
      env:
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/CoolgirlCombiner-ca65 -c Release -r linux-arm64 -o ${{ env.COMBINER_DIR }} ${{ env.SC_OPS }}

    - name: Build NesTiler for Linux-ARM64
      env:
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/NesTiler/NesTiler -c Release -r linux-arm64 -o ${{ env.NESTILER_DIR }} ${{ env.SC_OPS }}

    - name: Remove unnecessary files
      run: rm -f ${{ env.COMBINER_DIR }}/*.md ${{ env.NESTILER_DIR }}/*.md

    - name: Archive Linux-ARM64
      env:
        CMD: tar -czvf
      run: |
        ${{ env.CMD }} ${{ env.OUTPUT_FILE_ARM64 }} ${{ env.OUTPUT_DIR }}

    - name: Upload Linux-ARM64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.get_release_info.outputs.upload_url }}
        asset_path: ${{ env.OUTPUT_FILE_ARM64 }}
        asset_name: ${{ env.OUTPUT_FILE_ARM64 }}
        asset_content_type: tar.gz

  # =========================================================================
  # BLOCK 3: Build the project for macOS (Apple / Intel)
  # =========================================================================
  build-macos:
    needs: create-release # Wait for successful completion of Block 1
    strategy:
      matrix:
        sc: [no-self-contained, self-contained] # Build both normal and standalone (.NET included) versions
    runs-on: macos-latest # Launch macOS 13 virtual machine
    env:
      APP_NAME: coolgirl-multirom-builder-ca65
      OUTPUT_DIR: coolgirl-multirom-builder-ca65
      COMBINER_DIR: coolgirl-multirom-builder-ca65/tools/CoolgirlCombiner-ca65
      NESTILER_DIR: coolgirl-multirom-builder-ca65/tools/nestiler
      OUTPUT_FILE: coolgirl-multirom-builder-ca65-osx-arm64${{ matrix.sc == 'self-contained' && '-self-contained' || '' }}.tar.gz
    steps:
    # Step 3.1: Download source code from Git
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: true

    # Step 3.2: Configure .NET 6.0 SDK runtime
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 6.0.x

    # Step 3.3: Install argp library for macOS via Homebrew, required for cc65 (ca65)
    - name: Setup argp
      run: brew install argp-standalone
    
    - name: Install cc65 compiler (ca65)
      run: brew install cc65

    # Step 3.4: Create destination directory and copy key project sources
    - name: Copy main files
      run: >-
           mkdir -p ${{ env.OUTPUT_DIR }} &&
           cp -fR Makefile README.md configs demos games images spec src ${{ env.OUTPUT_DIR }}

    # Step 3.5: Download the text file with the saved release link
    - name: Load Release URL File from release job
      uses: actions/download-artifact@v4.1.7
      with:
        name: release_url

    # Step 3.6: Extract the release link into a variable for later upload
    - name: Get Release File Name & Upload URL
      id: get_release_info
      run: |
        value=`cat release_url.txt`
        echo upload_url=$value >> $GITHUB_OUTPUT

    # Step 3.7: Compile CoolgirlCombiner-ca65 for macOS x64 into an isolated folder
    - name: Build CoolgirlCombiner-ca65 for MacOS-x64
      env:
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/CoolgirlCombiner-ca65 -c Release -r osx-arm64 -o ${{ env.COMBINER_DIR }} ${{ env.SC_OPS }}

    # Step 3.8: Compile NesTiler for macOS x64 into an isolated folder
    - name: Build NesTiler for MacOS-x64
      env:
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/NesTiler/NesTiler -c Release -r osx-arm64 -o ${{ env.NESTILER_DIR }} ${{ env.SC_OPS }}

    # Step 3.9: Remove unnecessary markdown files from tool directories
    - name: Remove unnecessary files
      run: rm -f ${{ env.COMBINER_DIR }}/*.md ${{ env.NESTILER_DIR }}/*.md

    # Step 3.10: Run test compilation via Makefile to verify build functionality
    - name: Test build
      run: make -C ${{ env.OUTPUT_DIR }} all

    # Step 3.11: Remove temporary test files, leaving a clean structure for packaging
    - name: Clean
      run: make -C ${{ env.OUTPUT_DIR }} clean

    # Step 3.12: Create compressed .tar.gz archive with the macOS build
    - name: Archive MacOS
      env:
        CMD: tar -czvf
      run: |
        ${{ env.CMD }} ${{ env.OUTPUT_FILE }} ${{ env.OUTPUT_DIR }}

    # Step 3.13: Upload the ready tar.gz archive to GitHub release page
    - name: Upload MacOS
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.get_release_info.outputs.upload_url }}
        asset_path: ${{ env.OUTPUT_FILE }}
        asset_name: ${{ env.OUTPUT_FILE }}
        asset_content_type: tar.gz

  # =========================================================================
  # BLOCK 4: Build the project for Windows (x64)
  # =========================================================================
  build-windows:
    needs: create-release # Starts only after Block 1 completes successfully
    strategy:
      matrix:
        sc: [no-self-contained, self-contained] # Double build cycle: standard and with embedded .NET
    runs-on: windows-latest # Launch clean Windows Server OS
    env:
      APP_NAME: coolgirl-multirom-builder-ca65
      OUTPUT_DIR: coolgirl-multirom-builder-ca65
      COMBINER_DIR: coolgirl-multirom-builder-ca65/tools/CoolgirlCombiner-ca65
      NESTILER_DIR: coolgirl-multirom-builder-ca65/tools/nestiler
      OUTPUT_FILE: coolgirl-multirom-builder-ca65-win-x64${{ matrix.sc == 'self-contained' && '-self-contained' || '' }}.zip # For Windows we build a ZIP archive
    steps:
    # Step 4.1: Download repository
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: true

    # Step 4.2: Configure .NET SDK 6.0
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 6.0.x

    # Step 4.3: Deploy MSYS2 Linux-like environment (needed for GCC and Make on Windows)
    - name: Setup msys
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel
          gcc
          git
          libargp-devel
          zip

    # Step 4.4: Create directories and copy files.
    # Note: shell: msys2 {0} forces commands to run in MSYS2 Bash instead of Windows PowerShell
    - name: Copy main files
      shell: msys2 {0}
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        # Copy only what actually exists, suppressing errors about missing files
        cp -fR Makefile README.md configs demos games images spec src ${{ env.OUTPUT_DIR }}

    # Step 4.5: Build and install the cc65 (ca65) compiler from source
    - name: Build and install cc65 (ca65) from source
      shell: msys2 {0}
      run: |
        # Download the official compiler repository
        git clone --depth 1 https://github.com/cc65/cc65.git
        # Build it using built-in tools
        make -C cc65
        # Move executable files (including ca65) into the MSYS2 system folder
        cp -f cc65/bin/* /usr/bin/
        # Move libraries and headers so ca65 knows NES build rules
        mkdir -p /usr/share/cc65/
        cp -fR cc65/lib /usr/share/cc65/
        cp -fR cc65/include /usr/share/cc65/
        cp -fR cc65/asminc /usr/share/cc65/
        cp -fR cc65/cfg /usr/share/cc65/

    # Step 4.6: Import the text file with the release link from Block 1
    - name: Load Release URL File from release job
      uses: actions/download-artifact@v4.1.7
      with:
        name: release_url

    # Step 4.7: Read the text file and register the link in global parameters of this job
    - name: Get Release File Name & Upload URL
      id: get_release_info
      shell: msys2 {0}
      run: |
        value=`cat release_url.txt`
        echo "upload_url=$value" >> $GITHUB_OUTPUT

    # Step 4.8: Build the .NET application CoolgirlCombiner-ca65 for Windows x64 into the target subfolder
    - name: Build CoolgirlCombiner-ca65 for Win-x64
      env:
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/CoolgirlCombiner-ca65 -c Release -r win-x64 -o ${{ env.COMBINER_DIR }} ${{ env.SC_OPS }}

    # Step 4.9: Build the .NET application NesTiler for Windows x64 into the target subfolder
    - name: Build NesTiler for Win-x64
      env:
        SC_OPS: ${{ matrix.sc == 'self-contained' && '--self-contained true -p:PublishTrimmed=False' || '--no-self-contained' }}
      run: dotnet publish tools_sources/NesTiler/NesTiler -c Release -r win-x64 -o ${{ env.NESTILER_DIR }} ${{ env.SC_OPS }}

    # Step 4.10: Remove unnecessary documentation files from tool directories inside MSYS2
    - name: Remove unnecessary files
      shell: msys2 {0}
      run: rm -f ${{ env.COMBINER_DIR }}/*.md ${{ env.NESTILER_DIR }}/*.md

    # Step 4.11: Run test ROM compilation via the project Makefile inside MSYS2
    - name: Test build
      shell: msys2 {0}
      run: make -C ${{ env.OUTPUT_DIR }} all

    # Step 4.12: Remove leftover temporary files after the test build
    - name: Clean
      shell: msys2 {0}
      run: make -C ${{ env.OUTPUT_DIR }} clean

    # Step 4.13: Package the project folder with all tools into a .zip archive with maximum compression
    - name: Archive Windows
      env:
        CMD: zip -r9
      shell: msys2 {0}
      run: |
        ${{ env.CMD }} ${{ env.OUTPUT_FILE }} ${{ env.OUTPUT_DIR }}

    # Step 4.14: Upload the packaged zip archive to the GitHub release page
    - name: Upload Windows
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.get_release_info.outputs.upload_url }}
        asset_path: ${{ env.OUTPUT_FILE }}
        asset_name: ${{ env.OUTPUT_FILE }}
        asset_content_type: zip